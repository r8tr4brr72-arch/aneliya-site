<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гейша — акварель кодом</title>
<!-- p5.brush (standalone build): https://github.com/acamposuribe/p5.brush, MIT -->
<script src="https://cdn.jsdelivr.net/npm/p5.brush@3.3.0/dist/brush.js"></script>
<style>
  html, body { margin: 0; background: #1b1412; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { max-height: 100vh; max-width: 100vw; height: auto !important; width: auto !important; }
</style>
</head>
<body>
<script>
/*
  Вертикальная акварель 1080×1920 в стиле «Гейши»: бордовое солнце, горы, ветка сакуры тушью,
  цветы, лепестки, веер и красная печать-ханко.
  ?stage=N — нарисовать только первые N слоёв (для видео «картина рисуется»).
  ?seed=N  — другой вариант той же композиции.
*/
const W = 1080, H = 1920;
const q = new URLSearchParams(location.search);
const SEED = +(q.get("seed") || 7);
const STAGE = q.has("stage") ? +q.get("stage") : 99;

const PAPER = "#f2eadf", INK = "#1d1514", WINE = "#6e0d0b", WINE2 = "#9b1d1a",
      PINK = "#d98c99", PINK2 = "#efc3c6", GOLD = "#b58a3c", MIST = "#8d8f9c";

brush.createCanvas(W, H, { parent: document.body, pixelDensity: 1 });
brush.scaleBrushes(4.2);
brush.angleMode(brush.DEGREES);

// deterministic random so every stage redraws earlier layers identically
let _s = SEED * 9973;
const rnd = (a = 1, b) => { _s = (_s * 16807) % 2147483647; const r = (_s - 1) / 2147483646;
  return b === undefined ? r * a : a + r * (b - a); };
const reseed = k => { _s = (SEED * 9973 + k * 7919) % 2147483647 || 1; brush.seed(SEED * 1000 + k); };

// branch geometry is computed once so blossoms sit on it in every stage
reseed(1);
const branch = [];
{ let x = -40, y = 640, a = -8;
  for (let i = 0; i < 9; i++) { branch.push([x, y, 1.4 - i * 0.12]); a += rnd(-14, 10); x += 92; y += Math.sin(a * Math.PI / 180) * 92 + rnd(-10, 14); } }
const twigs = [3, 5, 7].map((i, k) => { const [x, y] = branch[i]; const dir = k % 2 ? 1 : -1;
  return [[x, y, 0.9], [x + 50, y + dir * 70, 0.7], [x + 110, y + dir * 120 + rnd(-20, 20), 0.4]]; });
const blossomSpots = [];
reseed(2);
[...branch.slice(2), ...twigs.flat()].forEach(([x, y]) => {
  const n = 1 + Math.floor(rnd(0, 2.4));
  for (let i = 0; i < n; i++) blossomSpots.push([x + rnd(-38, 38), y + rnd(-34, 30), rnd(16, 30)]);
});

const layers = [
  // 1. paper wash
  () => { brush.noStroke(); brush.fill("#e8dccb", 70); brush.fillBleed(0.3); brush.fillTexture(0.6, 0.1);
          brush.rect(-40, -40, W + 80, H + 80); },
  // 2. big wine sun
  () => { brush.noStroke(); brush.fill(WINE2, 190); brush.fillBleed(0.18, "out"); brush.fillTexture(0.55, 0.55);
          brush.circle(700, 560, 250, 0.25); },
  // 3. far mountains in mist
  () => { brush.noStroke(); brush.fill(MIST, 85); brush.fillBleed(0.35); brush.fillTexture(0.4, 0.2);
          brush.polygon([[-60, 1260], [180, 1080], [330, 1160], [520, 1010], [760, 1150], [930, 1060], [1140, 1180], [1140, 1400], [-60, 1400]]);
          brush.fill("#5d6072", 70);
          brush.polygon([[-60, 1330], [260, 1190], [470, 1290], [700, 1200], [1140, 1300], [1140, 1460], [-60, 1460]]); },
  // 4. ink branch
  () => { brush.noFill(); brush.set("charcoal", INK, 1.6); brush.spline(branch, 0.6);
          brush.set("2B", INK, 1.1); twigs.forEach(t => brush.spline(t, 0.5));
          brush.set("HB", INK, 0.8); brush.spline(branch.map(([x, y, p]) => [x + 6, y + 10, p * 0.6]), 0.6); },
  // 5. blossoms — pink washes
  () => { brush.noStroke(); brush.fillBleed(0.25); brush.fillTexture(0.35, 0.6);
          blossomSpots.forEach(([x, y, r], i) => { brush.fill(i % 3 ? PINK : PINK2, 170); brush.circle(x, y, r, 0.4); }); },
  // 6. blossom centres + a few wine petals
  () => { brush.noFill(); brush.set("HB", WINE, 0.5);
          blossomSpots.forEach(([x, y, r]) => { for (let k = 0; k < 5; k++) { const a = k * 72 + rnd(0, 30);
            brush.line(x + Math.cos(a * Math.PI / 180) * r * 0.12, y + Math.sin(a * Math.PI / 180) * r * 0.12,
                       x + Math.cos(a * Math.PI / 180) * r * 0.38, y + Math.sin(a * Math.PI / 180) * r * 0.38); } });
          brush.noStroke(); brush.fill(WINE2, 150);
          blossomSpots.filter((_, i) => i % 4 === 0).forEach(([x, y]) => brush.circle(x + 8, y - 6, 9, 0.5)); },
  // 7. falling petals
  () => { brush.noStroke(); brush.fillBleed(0.2); brush.fillTexture(0.2, 0.5);
          for (let i = 0; i < 26; i++) { const x = rnd(80, 1000), y = rnd(760, 1700);
            brush.fill(i % 5 ? PINK : WINE2, 160); brush.circle(x, y, rnd(7, 15), 0.7); } },
  // 8. folding fan — washes
  () => { const cx = 540, cy = 1640, R = 430, r0 = 120, n = 12, a0 = 205, a1 = 335;
          brush.noStroke(); brush.fillBleed(0.12); brush.fillTexture(0.45, 0.45);
          for (let i = 0; i < n; i++) { const t0 = a0 + (a1 - a0) * i / n, t1 = a0 + (a1 - a0) * (i + 1) / n;
            const P = (r, t) => [cx + Math.cos(t * Math.PI / 180) * r, cy + Math.sin(t * Math.PI / 180) * r];
            brush.fill(i % 2 ? WINE : "#2a1716", 200);
            brush.polygon([P(r0, t0), P(R, t0), P((R + R) / 2, (t0 + t1) / 2), P(R, t1), P(r0, t1)]); } },
  // 9. fan ribs, gold edge, sakura motif on the fan
  () => { const cx = 540, cy = 1640, R = 430, r0 = 120, n = 12, a0 = 205, a1 = 335;
          brush.noFill(); brush.set("HB", GOLD, 1);
          for (let i = 0; i <= n; i++) { const t = (a0 + (a1 - a0) * i / n) * Math.PI / 180;
            brush.line(cx + Math.cos(t) * 40, cy + Math.sin(t) * 40, cx + Math.cos(t) * R, cy + Math.sin(t) * R); }
          const edge = (r) => Array.from({ length: 25 }, (_, k) => { const t = (a0 + (a1 - a0) * k / 24) * Math.PI / 180;
            return [cx + Math.cos(t) * r, cy + Math.sin(t) * r, 0.9]; });
          brush.set("marker", GOLD, 0.6); brush.spline(edge(R - 6), 0.5); brush.spline(edge(r0), 0.5);
          brush.noStroke(); brush.fill(PINK2, 210); brush.fillBleed(0.15);
          [[420, 1390], [480, 1330], [620, 1350], [680, 1420], [560, 1300]].forEach(([x, y]) => brush.circle(x, y, 16, 0.4)); },
  // 10. hanko seal
  () => { brush.noStroke(); brush.fill("#b3241c", 230); brush.fillBleed(0.08); brush.fillTexture(0.7, 0.3);
          brush.rect(890, 1130, 92, 92);
          brush.noFill(); brush.set("pen", PAPER, 1.2); brush.line(912, 1150, 960, 1150); brush.line(936, 1150, 936, 1200);
          brush.line(912, 1176, 960, 1176); brush.line(912, 1200, 960, 1200); },
];

brush.clear(PAPER);
brush.push();
brush.translate(-W / 2, -H / 2);
// each layer dries (render) before the next, like real paper — earlier layers never change
layers.slice(0, STAGE).forEach((draw, i) => { reseed(10 + i); draw(); brush.render(); });
brush.pop();
brush.render();
window.__done = true;
</script>
</body>
</html>
